 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dist/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body>
    <header>
        <div class="flex justify-around mt-6">
            <h1>TASK MANAGMENT</h1>
            <input type="text" class="border rounded-lg px-4 py-2" placeholder="Rechercher une tâche..." id="search">
            <button class="btn" onclick="my_modal_1.showModal()">ajouter une tache</button>

        <dialog id="my_modal_1" class="modal">
                <div class="modal-box">

                    <h3 class="text-xl font-bold mb-4">
                        Création d'un nouveau CARD :
                    </h3>

                    <form id="form-card">
                        <!-- Title -->
                        <label class="block mb-1">Title :</label>
                        <input type="text" id="title" placeholder="Entre votre titre" class="input input-bordered w-full mb-2">

                        <!-- Description -->
                        <label class="block mb-1">Description :</label>
                        <textarea placeholder="Entre votre Description"
                            class="textarea textarea-bordered w-full mb-2" id="desc"></textarea>

                        <!-- Priority -->
                        <label class="block mb-1">Priority :</label>
                        <select class="select select-bordered w-full mb-2" id="Priority">
                            <option value="low">low</option>
                            <option value="medium">medium</option>
                            <option value="high" selected>high</option>
                        </select>

                        <!-- Name -->
                        <label class="block mb-1">Name :</label>
                        <input type="text" placeholder="Nom Assigné" class="input input-bordered w-full mb-4" id="name">

                        <button type="submit" class="btn">
                            submit
                        </button>
                    </form>

                    <div class="modal-action">
                        <form method="dialog">
                            <button class="btn">Close</button>
                        </form>
                    </div>

                </div>
            </dialog>
        </div>
    </header>

    <main>
        <section class="mt-6">
            <select class="border rounded-lg px-4 py-2 block mx-auto" id="select">
                <option value="">Toutes les priorités</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
            </select>
        </section>

        <section class="flex justify-center items-center mt-6 hidden" id ="erreur">
            <div
                class="bg-red border border-red-300 p-6 w-7xl rounded-lg text-red-700 flex justify-around items-center">
                Il y'a une erreur dans le serveur

                <button class="border p-2 rounded-lg bg-white text-red-700 px-4">
                    <i class="fa-solid fa-rotate-right"></i> Réessayer
                </button>
            </div>
        </section>

        <section class="p-6 flex justify-evenly">
            <div class="bg-[#60C1E5] rounded-xl p-4 w-80 min-h-96">

                <h2 class="text-xl font-bold text-gray-800 border border-white-500 text-center rounded-lg bg-white">
                    À faire
                </h2>
                <div id="todo"></div>
            </div>

            <div class="bg-[#FB6C00] rounded-xl p-4 w-80 min-h-96">

                <h2 class="text-xl font-bold text-gray-800 border border-white-500 text-center rounded-lg bg-white">
                    En cours
                </h2>
                <div id="in-progress"></div>
            </div>

            <div class="bg-[#7EC151] rounded-xl p-4 w-80 min-h-96">

                <h2 class="text-xl font-bold text-gray-800 border border-white-500 text-center rounded-lg bg-white">
                    À Valider
                </h2>
                <div id="done"></div>
            </div>
        </section>
    </main>

    <script src="../js/ui.js" type="module"></script>
</body>

</html>
